services:

  reactjs:
    build:
      dockerfile: Dockerfile
    command: /bin/sh -c "npm start"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    ports:
      - "${COMPOSE_REACTJS_PORT}:${COMPOSE_REACTJS_PORT}"
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${COMPOSE_REACTJS_PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

